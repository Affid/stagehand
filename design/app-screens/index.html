<title>App Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600;700&family=Amiri:wght@700&family=Roboto+Condensed:wght@700&display=swap">
<style>
/* A control bar, a phone on a stage, notes beside it (as the phone playground). Inside the phone:
   the app's own screens in the look of our Setup page (Foundry's dark Setup), one dark look on purpose. */
:root {
  --bg: #0b0a13; --bar: #17151f; --line: #2c2836; --fg: #e9e4f2; --muted: #a59eb4;
  --accent: #ee9b3a; --accent-ink: #1a1206; --bezel: #1d1b24; --bezel-edge: #3a3646;
  /* Inside the app: Foundry's dark Setup palette. */
  --app-bg: #100e18; --app-panel: #1a1724; --app-panel-2: #221e2e; --app-line: #353042; --app-fg: #efe9dd;
  --app-dim: #b5aec2; --app-warm: #ee9b3a; --app-warm-2: #ffbf6b; --app-ok: #6fdc8c; --app-plain: #e88a6a;
  --display: "Amiri", Georgia, serif; --title: "Roboto Condensed", "Arial Narrow", sans-serif; --body: "Signika", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0; font: 700 1.35rem/1 var(--display); }
.bar .tag { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg .lbl { padding: 0 10px; color: var(--muted); font-size: .86rem; }
.seg button { font: inherit; color: var(--muted); background: transparent; border: 0; border-left: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
.seg button:hover { background: rgb(255 255 255 / 5%); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg[hidden] { display: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stage { min-height: 0; overflow: auto; display: grid; place-items: start center; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.device { background: var(--bezel); border: 1px solid var(--bezel-edge); border-radius: 34px; padding: 10px; box-shadow: 0 20px 60px rgb(0 0 0 / 60%); }
.screen { position: relative; width: 360px; height: 760px; overflow: hidden; border-radius: 24px; background: var(--app-bg); display: flex; flex-direction: column; }
.status { flex: none; height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; color: #f2eef8; font: 600 12px/1 var(--body); background: #0b0a13; }
.gesture { flex: none; height: 18px; display: grid; place-items: center; background: #0d0c16; }
.gesture span { width: 108px; height: 4px; border-radius: 2px; background: #cfc8dc; opacity: .8; }
.notes { min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--bar); padding-block: 16px 24px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; }
.notes h2 { margin: 0; font: 700 1.25rem/1.15 var(--display); text-wrap: balance; }
.notes h3 { margin: 0 0 6px; font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.notes p, .notes li { margin: 0; color: #d6d0e2; max-width: 62ch; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.notes b { color: var(--fg); }
@media (max-width: 980px) { body { height: auto; } .main { grid-template-columns: minmax(0, 1fr); } .notes { border-left: 0; border-top: 1px solid var(--line); } .tools { margin-left: 0; } }

/* ---------- Inside the phone: the app ---------- */
.app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; color: var(--app-fg); background: radial-gradient(120% 60% at 50% 0%, #1d1830 0%, var(--app-bg) 60%); }
.app svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.top { flex: none; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; background: rgb(11 10 19 / 88%); border-bottom: 1px solid var(--app-line); }
.top h1 { margin: 0; font: 700 25px/1 var(--title); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .mark { width: 30px; height: 30px; border-radius: 7px; background: #2a2340; display: grid; place-items: center; flex: none; }
.top .mark i { display: flex; gap: 2px; align-items: end; height: 18px; }
.top .mark i b { width: 4px; border-radius: 1px; }
.top .sp { flex: 1; }
.ibtn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--app-fg); border-radius: 8px; cursor: pointer; }
.ibtn:hover { background: rgb(255 255 255 / 6%); }
.body { flex: 1; min-height: 0; overflow: auto; padding: 14px 12px 16px; display: grid; gap: 14px; align-content: start; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--app-dim); padding: 0 4px; }
.card { background: var(--app-panel); border: 1px solid var(--app-line); border-radius: 10px; }
.server { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
.server:hover { border-color: #4a4358; }
.server { box-sizing: border-box; padding-right: 4px; }
.server > span:nth-child(2) { min-width: 0; }
.server .ico { width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(160deg, #3b2a52, #1e1a2c); color: var(--app-warm-2); font: 700 18px/1 var(--title); }
.server .nm { font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.server .sub { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--app-dim); margin-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid; }
.chip.plain { color: var(--app-plain); border-color: rgb(232 138 106 / 45%); }
.chip.ok { color: var(--app-ok); border-color: rgb(111 220 140 / 40%); }
.chip svg { width: 12px; height: 12px; }
.chev { color: var(--app-dim); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 48px; padding: 0 18px; border-radius: 6px; border: 1px solid var(--app-line); background: var(--app-panel-2); color: var(--app-fg); font: 600 15px/1 var(--body); cursor: pointer; }
.btn.bright { background: linear-gradient(180deg, #f4a845, #d9832a); border-color: #b06a1e; color: #1a1206; font-weight: 700; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; }
.dock { flex: none; padding: 10px 12px 12px; border-top: 1px solid var(--app-line); background: rgb(14 12 22 / 96%); display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-height: 52px; }
.row + .row { border-top: 1px solid var(--app-line); }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 600; }
.row .tx span { display: block; font-size: 12.5px; color: var(--app-dim); margin-top: 2px; }
.switch { width: 44px; height: 26px; border-radius: 999px; background: #3a3446; position: relative; flex: none; border: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #cfc8dc; transition: left .15s; }
.switch[aria-checked="true"] { background: #3f8a52; }
.switch[aria-checked="true"]::after { left: 21px; background: #fff; }
.foot { text-align: center; font-size: 11.5px; color: #7d768b; padding: 4px 0 2px; }
.empty { text-align: center; padding: 26px 18px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { margin: 0; font: 700 22px/1.15 var(--display); }
.empty p { margin: 0; color: var(--app-dim); font-size: 13.5px; }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 55%); z-index: 30; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--app-panel); border-top: 1px solid var(--app-line); border-radius: 16px 16px 0 0; padding: 8px 16px 16px; display: grid; gap: 14px; box-shadow: 0 -10px 40px rgb(0 0 0 / 50%); }
.sheet .grab { justify-self: center; width: 40px; height: 4px; border-radius: 2px; background: #5a5268; margin: 2px 0 2px; }
.sheet h2 { margin: 0; font: 700 21px/1.15 var(--display); }
.sheet p { margin: 0; color: var(--app-dim); font-size: 13px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--app-dim); }
.addr { display: flex; align-items: stretch; border: 1px solid #4a4358; border-radius: 7px; overflow: hidden; background: #0f0d16; height: 48px; }
.addr:focus-within { border-color: var(--app-warm); box-shadow: 0 0 0 3px rgb(238 155 58 / 20%); }
.addr .scheme { display: flex; border-right: 1px solid #4a4358; }
.addr .scheme button { font: 600 13px/1 var(--body); border: 0; padding: 0 10px; background: transparent; color: var(--app-dim); cursor: pointer; }
.addr .scheme button[aria-pressed="true"] { background: #2b2538; color: var(--app-fg); }
.addr input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--app-fg); font: 15px/1 var(--body); padding: 0 12px; }
.addr input::placeholder { color: #6d6679; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 7px; background: #13261a; color: #c4f0cf; border: 1px solid rgb(111 220 140 / 30%); }
.check.warn { background: #2c1d16; color: #f3c7b5; border-color: rgb(232 138 106 / 35%); }
.input { height: 48px; border: 1px solid #4a4358; border-radius: 7px; background: #0f0d16; color: var(--app-fg); font: 15px/1 var(--body); padding: 0 12px; }
select.input { appearance: none; }

/* Our login */
.loginbody { align-content: start; padding-top: 22px; }
.logincard { padding: 22px 16px 18px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.logincard .ico { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(160deg, #3b2a52, #1e1a2c); color: var(--app-warm-2); font: 700 24px/1 var(--title); }
.logincard h2 { margin: 0; font: 700 25px/1.1 var(--display); }
.logincard .where { margin: -6px 0 0; font-size: 13px; color: var(--app-dim); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
.logincard .field { width: 100%; text-align: left; }
.pw { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 6px 0 12px; border: 1px solid #4a4358; border-radius: 7px; background: #0f0d16; }
.pw.focus { border-color: var(--app-warm); box-shadow: 0 0 0 3px rgb(238 155 58 / 20%); }
.pw.bad { border-color: #c4553f; box-shadow: 0 0 0 3px rgb(196 85 63 / 18%); }
.pw svg { width: 18px; height: 18px; color: var(--app-dim); }
.pw input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--app-fg); font: 17px/1 var(--body); letter-spacing: .12em; }
.pw input::placeholder { letter-spacing: 0; font-size: 15px; color: #6d6679; }
.pw .ibtn { width: 40px; height: 40px; }
.suggest { width: 100%; box-sizing: border-box; margin-top: -8px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #26222f; border: 1px solid #3a3446; text-align: left; font-size: 13px; }
.suggest b { display: block; font-weight: 600; }
.suggest span { color: var(--app-dim); font-size: 12px; }
.suggest svg { width: 20px; height: 20px; color: #9db8ff; flex: none; }
.err { width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 13px; padding: 9px 12px; border-radius: 7px; background: #2c1d16; color: #f3c7b5; border: 1px solid rgb(232 138 106 / 35%); }
.err svg { width: 16px; height: 16px; flex: none; }
.loginhint { margin: 2px 6px 0; font-size: 12.5px; color: #8e869c; text-align: center; }

/* Launch: the world's page behind, then progress */
.wpage { flex: 1; min-height: 0; overflow: auto; }
.wbanner { height: 150px; display: grid; align-content: end; padding: 14px 16px; background: linear-gradient(180deg, rgb(0 0 0 / 10%), rgb(16 14 24 / 96%)), linear-gradient(135deg, #6b2d1a, #2a1530 55%, #141020); }
.wbanner h2 { margin: 0; font: 700 30px/1 var(--title); text-transform: uppercase; }
.queued { margin: 14px 12px 0; }
.chg { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; }
.chg + .chg { border-top: 1px solid var(--app-line); }
.chg i { font-style: normal; font-weight: 700; width: 18px; text-align: center; }
.chg .on { color: var(--app-ok); } .chg .off { color: var(--app-plain); }
.chg span { color: var(--app-dim); font-size: 12.5px; margin-left: auto; }
.prog { flex: 1; min-height: 0; overflow: auto; display: grid; align-content: start; gap: 18px; padding: 70px 18px 18px; background: radial-gradient(120% 50% at 50% 0%, #2a2040, var(--app-bg) 60%); }
.prog h2 { margin: 0; font: 700 34px/1 var(--title); text-transform: uppercase; }
.prog .lead { margin: -8px 0 0; color: var(--app-dim); font-size: 13.5px; }
.barbox { height: 8px; border-radius: 4px; background: #2b2538; overflow: hidden; }
.barbox i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #d9832a, #f4a845); transition: width .5s; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: #7d768b; }
.steps li.done { color: var(--app-fg); } .steps li.now { color: var(--app-warm-2); font-weight: 600; }
.steps li small { grid-column: 2; display: block; margin-top: -8px; font-size: 12px; color: var(--app-dim); font-weight: 400; }
.steps .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #3a3446; box-sizing: border-box; }
.steps li.done .dot { background: #1f3a28; border-color: rgb(111 220 140 / 60%); color: var(--app-ok); }
.steps li.now .dot { border-color: var(--app-warm); }
.steps li.now .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--app-warm); }
.steps .dot svg { width: 13px; height: 13px; stroke-width: 2.6; }
.note-ok { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 7px; background: #13261a; color: #c4f0cf; border: 1px solid rgb(111 220 140 / 30%); }
.note-ok svg, .note-bad svg { width: 16px; height: 16px; flex: none; }
.note-bad { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 7px; background: #2c1d16; color: #f3c7b5; border: 1px solid rgb(232 138 106 / 35%); }

/* Running screen */
.hero { position: relative; min-height: 270px; display: grid; align-content: end; gap: 8px; padding: 70px 16px 18px; background: linear-gradient(180deg, rgb(0 0 0 / 30%), rgb(16 14 24 / 96%)), linear-gradient(135deg, #6b2d1a, #2a1530 55%, #141020); }
.hero .live { justify-self: start; display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #bdf0c6; background: rgb(20 60 32 / 75%); border: 1px solid rgb(120 220 140 / 35%); }
.hero .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--app-ok); }
.hero h2 { margin: 0; font: 700 38px/1 var(--title); text-transform: uppercase; text-shadow: 0 0 8px #000; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #ddd5e6; }
.runbody { padding: 16px 14px 18px; display: grid; gap: 12px; }
.runbody p { margin: 0; font-size: 13.5px; color: var(--app-dim); }
.runbody .hint { font-size: 12.5px; color: #8e869c; }
.btn .sub { font-weight: 600; font-size: 12.5px; opacity: .8; }
.topover { position: absolute; top: 0; left: 0; right: 0; z-index: 3; background: linear-gradient(180deg, rgb(0 0 0 / 55%), transparent); border-bottom-color: transparent; }
.toast { position: absolute; left: 12px; right: 12px; top: 64px; z-index: 40; padding: 10px 12px; border-radius: 8px; background: #1f3a28; border: 1px solid rgb(111 220 140 / 35%); color: #d8f5df; font-size: 13px; }
</style>

<header class="bar">
  <h1>App Screens</h1>
  <span class="tag">Mockup · our own pages, no game</span>
  <div class="tools">
    <span class="seg" role="group" aria-label="Screen"><span class="lbl">Screen</span>
      <button type="button" data-s="home" aria-pressed="true">Home</button>
      <button type="button" data-s="add" aria-pressed="false">Add a server</button>
      <button type="button" data-s="login" aria-pressed="false">Log in</button>
      <button type="button" data-s="launch" aria-pressed="false">Launch</button>
      <button type="button" data-s="running" aria-pressed="false">Running</button>
    </span>
    <span class="seg" role="group" aria-label="Home variant" id="homeVar"><span class="lbl">Home</span>
      <button type="button" data-hv="a" aria-pressed="true">A · Servers first</button>
      <button type="button" data-hv="b" aria-pressed="false">B · Settings list</button>
      <button type="button" data-hv="empty" aria-pressed="false">No servers yet</button>
    </span>
    <span class="seg" role="group" aria-label="Login state" id="loginVar" hidden><span class="lbl">State</span>
      <button type="button" data-lgv="ready" aria-pressed="true">Ready</button>
      <button type="button" data-lgv="wrong" aria-pressed="false">Wrong password</button>
    </span>
    <span class="seg" role="group" aria-label="Launch step" id="launchVar" hidden><span class="lbl">Step</span>
      <button type="button" data-lnv="review" aria-pressed="true">Review</button>
      <button type="button" data-lnv="progress" aria-pressed="false">Launching</button>
    </span>
    <span class="seg" role="group" aria-label="Running state" id="runVar" hidden><span class="lbl">State</span>
      <button type="button" data-rv="applied" aria-pressed="true">After a launch</button>
      <button type="button" data-rv="later" aria-pressed="false">Opened later</button>
      <button type="button" data-rv="failed" aria-pressed="false">Changes failed</button>
    </span>
  </div>
</header>
<div class="main">
  <main class="stage">
    <div class="device"><div class="screen">
      <div class="status" aria-hidden="true"><span>19:35</span><span>▮▮▮ ◔</span></div>
      <div class="app" id="app"></div>
      <div class="gesture" aria-hidden="true"><span></span></div>
    </div></div>
  </main>
  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>

<script>
const ICON = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  dots: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>',
  open: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  unlock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  door: '<svg viewBox="0 0 24 24"><path d="M14 4H6v16h8M14 4l5 2v12l-5 2zM11 12h.01"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>',
  servers: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg>',
  history: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4M12 8v4l3 2"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></svg>',
  key: '<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l3 3M14 9l2 2"/></svg>',
  eye: '<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
};
const MARK = '<span class="mark" aria-hidden="true" style="background:#2a2340;overflow:hidden;display:block"><svg viewBox="22 21 64 64" style="width:100%;height:100%;display:block;fill:revert;stroke:none"><rect x="33" y="26" width="42" height="4.5" fill="#6a5b8c"/><circle cx="54" cy="41" r="11" fill="#d9a441"/><circle cx="54" cy="41" r="4.5" fill="#2a2340"/><path d="M43,77 V41 A11,11 0 0 1 65,41 V60" fill="none" stroke="#efe3c8" stroke-width="4.6"/><path fill="#c0584a" d="M65,58 C58.5,62.5 56.5,71 57.5,76 Q65,82.5 72.5,76 C73.5,71 71.5,62.5 65,58 Z"/></svg></span>';
const SERVERS = [
  { name: "Home server", addr: "http://192.168.1.20:30000", last: "Opened today", plain: true, letter: "H" },
  { name: "Friday group", addr: "https://vtt.example.com/foundry", last: "Opened 5 days ago", plain: false, letter: "F" },
];
const S = { s: "home", hv: "a", lgv: "ready", lnv: "review", rv: "applied", step: 0, closing: false, sheet: null, edit: null, removing: false, scheme: "http", typed: "192.168.1.20:30000", history: false, join: false, toast: "" };
const app = document.getElementById("app"), notes = document.getElementById("notes");
const host = (a) => a.replace(/^https?:\/\//, "");

function serverCard(s, i) {
  return `<div class="card server" data-go="login">
    <span class="ico">${s.letter}</span>
    <span><span class="nm" style="display:block">${s.name}</span><span class="sub"><span>${host(s.addr)}</span>${s.plain ? `<span class="chip plain">${ICON.unlock}Not encrypted</span>` : ""}<span>${s.last}</span></span></span>
    <button type="button" class="ibtn" data-edit="${i}" aria-label="Edit or remove ${s.name}">${ICON.dots}</button></div>`;
}

/** A server's own sheet: rename, change the address, remove. */
function editSheet() {
  const s = SERVERS[S.edit];
  if (S.removing) return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-label="Remove ${s.name}">
    <span class="grab"></span><h2>Remove ${s.name}?</h2>
    <p>Stagehand stops opening ${host(s.addr)}. Its library (folders, tags, presets) stays in this app, for when you add the server again; nothing on the server changes.</p>
    <button class="btn wide" style="border-color:#8a3a2a;color:#ffb39e" data-act="removed">Remove</button>
    <button class="btn ghost wide" data-act="close">Cancel</button></div>`;
  const scheme = s.addr.startsWith("https") ? "https" : "http";
  return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-label="${s.name}">
    <span class="grab"></span><h2>${s.name}</h2>
    <div class="field"><label for="nm">Name</label><input id="nm" class="input" value="${s.name}"></div>
    <div class="field"><label for="ea">Address</label>
      <div class="addr"><span class="scheme" role="group" aria-label="Protocol"><button type="button" aria-pressed="${scheme === "http"}">http</button><button type="button" aria-pressed="${scheme === "https"}">https</button></span>
      <input id="ea" value="${host(s.addr)}" inputmode="url"></div>
      <p>A new address keeps this server's library: use it when the server moved (a new IP or name).</p></div>
    <button class="btn bright wide" data-act="saved">Save</button>
    <button class="btn ghost wide" style="color:#ffb39e" data-act="remove">Remove this server…</button>
  </div>`;
}

function homeA() {
  const list = S.hv === "empty"
    ? `<div class="card empty"><h2>Your Foundry servers</h2><p>Add the address you open Foundry at, for example 192.168.1.20:30000. Stagehand then shows its own Setup page there.</p></div>`
    : `<div class="eyebrow">Servers</div>${SERVERS.map(serverCard).join("")}<p style="margin:0 4px;font-size:12px;color:#8e869c">Tap a server to open it; ⋮ to rename it, change its address or remove it.</p>`;
  return `<header class="top">${MARK}<h1>Stagehand</h1><span class="sp"></span><button class="ibtn" aria-label="More">${ICON.dots}</button></header>
  <div class="body">${list}
    <div class="eyebrow" style="margin-top:6px">Settings</div>
    <div class="card"><div class="row"><span class="chev" style="color:var(--app-warm-2)">${ICON.history}</span><span class="tx"><b>Release history</b><span>The Update page reads Foundry's public release notes at foundryvtt.com.</span></span><button class="switch" role="switch" aria-checked="${S.history}" data-act="history" aria-label="Release history"></button></div></div>
    <div class="foot">Stagehand 0.2.0 · build 61457e0</div>
  </div>
  <div class="dock"><button class="btn bright wide" data-act="add">${ICON.plus}Add a server</button></div>`;
}

function homeB() {
  const rows = S.hv === "empty" ? `<div class="row"><span class="tx"><b>No servers yet</b><span>Add the address you open Foundry at.</span></span></div>` :
    SERVERS.map((s) => `<button class="row" style="width:100%;background:transparent;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer" data-go="login"><span class="tx"><b>${s.name}</b><span>${host(s.addr)} · ${s.last}</span></span>${s.plain ? `<span class="chip plain">${ICON.unlock}http</span>` : `<span class="chip ok">${ICON.lock}https</span>`}<span class="chev">${ICON.chev}</span></button>`).join("");
  return `<header class="top">${MARK}<h1>Stagehand</h1></header>
  <div class="body">
    <div class="eyebrow">Servers</div>
    <div class="card">${rows}<button class="row" style="width:100%;background:transparent;border:0;border-top:1px solid var(--app-line);color:var(--app-warm-2);font:inherit;font-weight:600;cursor:pointer" data-act="add">${ICON.plus}<span class="tx">Add a server</span></button></div>
    <div class="eyebrow">Foundry</div>
    <div class="card"><div class="row"><span class="tx"><b>Release history</b><span>Read release notes from foundryvtt.com</span></span><button class="switch" role="switch" aria-checked="${S.history}" data-act="history" aria-label="Release history"></button></div>
      <div class="row"><span class="tx"><b>About Stagehand</b><span>Version 0.2.0 · build 61457e0</span></span><span class="chev">${ICON.chev}</span></div></div>
  </div>`;
}

function addSheet() {
  const raw = S.typed.trim();
  const full = /^https?:\/\//.test(raw) ? raw : `${S.scheme}://${raw}`;
  const check = !raw ? "" : S.scheme === "https" && /^\d+\.\d+/.test(raw)
    ? `<div class="check warn">${ICON.warn}No answer over https. Home servers usually use http: try http.</div>`
    : `<div class="check">${ICON.check}Foundry 14.370 answers at ${full}</div>`;
  return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-label="Add a server">
    <span class="grab"></span><h2>Add a server</h2>
    <div class="field"><label for="addr">Address</label>
      <div class="addr"><span class="scheme" role="group" aria-label="Protocol"><button type="button" data-scheme="http" aria-pressed="${S.scheme === "http"}">http</button><button type="button" data-scheme="https" aria-pressed="${S.scheme === "https"}">https</button></span>
      <input id="addr" value="${S.typed}" placeholder="192.168.1.20:30000" autocomplete="off" inputmode="url"></div>
      <p>Type it as Foundry shows it, without http. Home servers on your network use <b>http</b>; one on the internet with a name, <b>https</b>. Pasting a whole address with http:// or https:// picks it for you.</p>
    </div>
    ${check}
    <button class="btn bright wide" data-act="added">Add and open</button>
  </div>`;
}

/** Our login: the admin password in a native Android field, so password managers fill it. */
function login() {
  const wrong = S.lgv === "wrong";
  return `<header class="top"><button class="ibtn" data-act="home" aria-label="Servers">${ICON.back}</button><h1 style="font-size:21px">Home server</h1><span class="sp"></span></header>
  <div class="body loginbody">
    <div class="card logincard">
      <span class="ico">H</span>
      <h2>Log in to Setup</h2>
      <p class="where"><span>192.168.1.20:30000</span><span class="chip plain">${ICON.unlock}Not encrypted</span></p>
      <div class="field"><label for="pw">Administrator password</label>
        <div class="pw ${wrong ? "bad" : "focus"}">${ICON.key}<input id="pw" type="password" value="${wrong ? "hunter2" : ""}" placeholder="Password" autocomplete="current-password"><button class="ibtn" aria-label="Show password">${ICON.eye}</button></div></div>
      ${wrong ? `<div class="err">${ICON.warn}That isn't this server's administrator password.</div>` : `<button class="suggest" data-act="filled">${ICON.shield}<span><b>Home server</b><span>From your password manager · 192.168.1.20</span></span></button>`}
      <button class="btn bright wide" data-act="loggedin">Log in</button>
    </div>
    <p class="loginhint">Foundry asks for the administrator password set in its configuration. A server without one opens Setup straight away; one with a world running opens the running page.</p>
  </div>`;
}

const CHANGES = [["on", "+", "Dice So Nice!", "turn on"], ["off", "−", "Old Lighting", "turn off"]];

/** Launch from our Setup: the review asks who applies the changes, then our progress screen. */
function launch() {
  if (S.lnv === "progress") return progress();
  const list = CHANGES.map(([k, sign, name, what]) => `<div class="chg"><i class="${k}">${sign}</i>${name}<span>${what}</span></div>`).join("");
  return `<header class="top topover"><button class="ibtn" aria-label="Worlds">${ICON.back}</button><span class="sp"></span></header>
  <div class="wpage"><div class="wbanner"><h2>Curse of Strahd</h2></div>
    <div class="eyebrow" style="margin:14px 16px 0">Next launch · 2 changes</div><div class="card queued">${list}</div></div>
  <div class="dock"><button class="btn bright wide" data-act="review">${ICON.play}Launch</button></div>
  <div class="scrim"></div><div class="sheet" role="dialog" aria-label="Launch Curse of Strahd">
    <span class="grab"></span><h2>Launch Curse of Strahd</h2>
    <div class="card">${list}</div>
    <div class="field"><label for="gm">Apply them as</label><select id="gm" class="input"><option>Gamemaster</option><option>Assistant GM</option></select></div>
    <div class="field"><label for="gmpw">Gamemaster's password</label><div class="pw">${ICON.key}<input id="gmpw" type="password" placeholder="Leave empty if the user has none" autocomplete="current-password"></div></div>
    <p>The app joins as this user out of sight; the companion applies the changes and the world reloads once. The game never opens on this phone.</p>
    <button class="btn bright wide" data-act="go">${ICON.play}Launch and apply</button>
    <button class="btn ghost wide" data-act="go">Launch without changes</button>
  </div>`;
}

const STEPS = [
  ["Asking Foundry to launch", "Foundry checks the world and its packages."],
  ["Loading the world", "Foundry's own progress, step by step."],
  ["Joining as Gamemaster, out of sight", "No game screen; the app is the only one in the world."],
  ["Applying 2 changes", "The world reloads once."],
];

function progress() {
  const step = Math.min(S.step, STEPS.length);
  const pct = [6, 38, 72, 90, 100][step];
  const rows = STEPS.map(([title, sub], i) => {
    const cls = i < step ? "done" : i === step ? "now" : "";
    return `<li class="${cls}"><span class="dot">${i < step ? ICON.check : ""}</span><span>${title}</span>${i === step ? `<small>${sub}</small>` : ""}</li>`;
  }).join("");
  return `<header class="top topover"><span class="sp"></span><span class="chip" style="color:#ffbf6b;border-color:rgb(255 191 107 / 40%)">Home server</span></header>
  <div class="prog"><span class="live" style="justify-self:start;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ffd9a6;background:rgb(70 44 12 / 70%)">Launching</span>
    <h2>Curse of Strahd</h2><p class="lead">This takes 10 to 30 seconds on most servers. You can leave this screen; the launch goes on.</p>
    <div class="barbox"><i style="width:${pct}%"></i></div>
    <ol class="steps">${rows}</ol>
  </div>
  <div class="dock"><button class="btn ghost wide" data-act="home">${ICON.servers}Server list</button></div>`;
}

/** The running page: no game, only Back to Setup and Server list. */
function running() {
  const later = S.rv === "later", failed = S.rv === "failed";
  const state = later ? `<p>Setup, the Library and backups come back once the world is closed.</p>`
    : failed ? `<div class="note-bad">${ICON.warn}<span>The 2 changes didn't apply: the Gamemaster's password was wrong. They stay queued for the next launch.</span></div>`
    : `<div class="note-ok">${ICON.check}2 changes applied as it opened.</div>`;
  return `<header class="top topover"><button class="ibtn" data-act="home" aria-label="Servers">${ICON.back}</button><h1 style="font-size:20px">Home server</h1><span class="sp"></span></header>
  <div style="flex:1;min-height:0;overflow:auto">
    <div class="hero"><span class="live"><i></i>Running now</span><h2>Curse of Strahd</h2><div class="meta"><span>dnd5e 5.1.4</span><span>${later ? "2 people in the game" : "Nobody in the game"}</span><span>${later ? "For 1 h 40 min" : "Just started"}</span></div></div>
    <div class="runbody">${state}
      <button class="btn bright wide" data-act="close">${ICON.door}Back to Setup</button>
      <button class="btn wide" data-act="home">${ICON.servers}Server list</button>
      <p class="hint">Back to Setup closes the world for everyone. Server list leaves it running.</p></div>
  </div>
  ${S.closing ? closeSheet(later) : ""}`;
}

function closeSheet(later) {
  return `<div class="scrim" data-act="cancel"></div><div class="sheet" role="dialog" aria-label="Close Curse of Strahd">
    <span class="grab"></span><h2>Close Curse of Strahd?</h2>
    <p>Foundry saves the world and closes it${later ? "; the 2 people in the game are disconnected" : ""}. Then our Setup opens.</p>
    <div class="field"><label for="cpw">Administrator password</label><div class="pw focus">${ICON.key}<input id="cpw" type="password" placeholder="Password" autocomplete="current-password"></div></div>
    <button class="btn bright wide" data-act="closed">${ICON.door}Close and open Setup</button>
    <button class="btn ghost wide" data-act="cancel">Cancel</button>
  </div>`;
}

const NOTES = {
  home: () => `<div><h2>Home: your servers</h2><p>The screen the app opens on when no server was open last. Same dark Setup look and type as our Setup page.</p></div>
    <div><h3>A · Servers first</h3><ul><li>Each server as a card, like a world in the Worlds list: a name (you can rename it), the address, <b>Not encrypted</b> on http, when you last opened it. Tap opens it.</li><li><b>Add a server</b> by your thumb at the bottom.</li><li>Release history as one switch under Settings.</li><li><b>⋮ on each card</b> opens the server's sheet: rename it, change its address (http/https toggle; its library stays with it), or <b>Remove this server…</b>, which asks first and keeps the library in the app.</li><li>⋮ in the top bar: About.</li></ul></div>
    <div><h3>B · Settings list</h3><ul><li>Android-settings style: grouped rows, http or https as a small chip, Add a server as the list's last row.</li><li>Quieter, closer to a settings page than to Setup.</li></ul></div>
    <div><h3>Try</h3><ul><li>Tap a server: Foundry's login opens (Screen: Foundry's login).</li><li>Tap ⋮ on a card: rename, change the address, remove.</li><li>Tap Add a server.</li><li><b>No servers yet</b> shows the first start.</li></ul></div>`,
  add: () => `<div><h2>Adding a server</h2><p>No protocol to type: <b>http</b> or <b>https</b> is a toggle in front of the address, http first (home servers). A whole address pasted with http:// or https:// sets it.</p></div>
    <div><h3>New</h3><ul><li>The app checks the address before saving: it asks the server for Foundry's status and says what answered ("Foundry 14.370 answers"), or suggests the other protocol.</li><li><b>Add and open</b> saves it and opens its login.</li></ul></div>
    <div><h3>Try</h3><ul><li>Switch to https with the 192.168… address: the hint suggests http.</li><li>Type your own address.</li></ul></div>`,
  login: () => `<div><h2>Our login, not Foundry's</h2><p>The app replaces Foundry's admin login with its own screen in the app's look. ‹ goes back to your servers.</p></div>
    <div><h3>The password field is native</h3><ul><li>A real Android password field, not a web one, that tells password managers it belongs to your server's address, so Bitwarden can match and fill the login saved for that address.</li><li>The suggestion under the field shows where Bitwarden's offer appears.</li><li>The password goes from that field straight to Foundry; the app doesn't keep it.</li></ul></div>
    <div><h3>Try</h3><ul><li>State: <b>Wrong password</b> shows Foundry's refusal in our words.</li><li><b>Log in</b> opens our Setup.</li></ul></div>`,
  launch: () => `<div><h2>Launching</h2><p>From the moment you tap Launch, our screen shows what Foundry is doing, instead of 10 to 30 seconds of nothing.</p></div>
    <div><h3>With changes waiting</h3><ul><li>The review asks which Gamemaster applies them, and that user's password (a native field too).</li><li>After the launch the app joins as that user out of sight; the companion applies the changes and the world reloads once. The game never shows.</li><li><b>Launch without changes</b> keeps them queued.</li></ul></div>
    <div><h3>Try</h3><ul><li><b>Launch and apply</b> plays the steps; the running page follows.</li><li>Step: <b>Launching</b> jumps to the progress screen.</li></ul></div>`,
  running: () => `<div><h2>A world is running</h2><p>The app never opens Foundry's game. This page says what runs, and offers two ways on.</p></div>
    <div><h3>Actions</h3><ul><li><b>Back to Setup</b> closes the world (Foundry asks for the administrator password, in a native field) and opens our Setup.</li><li><b>Server list</b> leaves the world running and goes back to your servers.</li></ul></div>
    <div><h3>States</h3><ul><li><b>After a launch</b>: the changes applied.</li><li><b>Opened later</b>: who is in the game and for how long (the clock now counts minutes, not hours).</li><li><b>Changes failed</b>: why, and that they stay queued.</li></ul></div>`,
};

function render() {
  document.querySelectorAll("[data-s]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === S.s)));
  document.querySelectorAll("[data-hv]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.hv === S.hv)));
  document.querySelectorAll("[data-lgv]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lgv === S.lgv)));
  document.querySelectorAll("[data-lnv]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lnv === S.lnv)));
  document.querySelectorAll("[data-rv]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.rv === S.rv)));
  document.getElementById("homeVar").hidden = !(S.s === "home" || S.s === "add");
  document.getElementById("loginVar").hidden = S.s !== "login";
  document.getElementById("launchVar").hidden = S.s !== "launch";
  document.getElementById("runVar").hidden = S.s !== "running";
  let html = "";
  if (S.s === "home" || S.s === "add") html = (S.hv === "b" ? homeB() : homeA()) + (S.s === "add" ? addSheet() : "") + (S.s === "home" && S.edit !== null ? editSheet() : "");
  if (S.s === "login") html = login();
  if (S.s === "launch") html = launch();
  if (S.s === "running") html = running();
  if (S.toast) html += `<div class="toast">${S.toast}</div>`;
  app.innerHTML = html;
  notes.innerHTML = NOTES[S.s === "add" ? "add" : S.s]();
  const input = document.getElementById("addr");
  if (input) input.addEventListener("input", (e) => {
    const v = e.target.value;
    const m = /^(https?):\/\/(.*)$/i.exec(v);
    if (m) { S.scheme = m[1].toLowerCase(); S.typed = m[2]; render(); document.getElementById("addr").focus(); return; }
    S.typed = v; const pos = e.target.selectionStart; render(); const again = document.getElementById("addr"); again.focus(); again.setSelectionRange(pos, pos);
  });
}

let timer = null;
function stopSteps() { if (timer) clearInterval(timer); timer = null; S.step = 0; }
function playSteps() {
  stopSteps();
  timer = setInterval(() => {
    S.step += 1;
    if (S.step > STEPS.length) { stopSteps(); S.s = "running"; S.rv = "applied"; S.lnv = "review"; }
    render();
  }, 1400);
}

function flash(text) { S.toast = text; render(); setTimeout(() => { S.toast = ""; render(); }, 1800); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-act], [data-go]");
  if (!t) return;
  if (t.dataset.s) { S.s = t.dataset.s; S.sheet = null; S.closing = false; stopSteps(); if (S.s === "launch" && S.lnv === "progress") playSteps(); return render(); }
  if (t.dataset.lgv) { S.lgv = t.dataset.lgv; return render(); }
  if (t.dataset.lnv) { S.lnv = t.dataset.lnv; stopSteps(); if (S.lnv === "progress") playSteps(); return render(); }
  if (t.dataset.rv) { S.rv = t.dataset.rv; return render(); }
  if (t.dataset.hv) { S.hv = t.dataset.hv; return render(); }
  if (t.dataset.scheme) { S.scheme = t.dataset.scheme; return render(); }
  if (t.dataset.edit !== undefined) { e.stopPropagation(); S.edit = Number(t.dataset.edit); S.removing = false; return render(); }
  if (t.dataset.go === "login") { S.s = "login"; return render(); }
  const a = t.dataset.act;
  if (a === "add") { S.s = "add"; return render(); }
  if (a === "close" && S.s !== "running") { if (S.s === "add") S.s = "home"; S.edit = null; S.removing = false; return render(); }
  if (a === "remove") { S.removing = true; return render(); }
  if (a === "removed") { const n = SERVERS[S.edit].name; S.edit = null; S.removing = false; return flash(`${n} removed. Its library stays in this app.`); }
  if (a === "saved") { S.edit = null; return flash("Saved."); }
  if (a === "added") { S.s = "login"; S.lgv = "ready"; return render(); }
  if (a === "history") { S.history = !S.history; return render(); }
  if (a === "home") { S.s = "home"; S.closing = false; stopSteps(); return render(); }
  if (a === "filled") { S.lgv = "ready"; return flash("Filled by your password manager."); }
  if (a === "loggedin") { return flash("Logged in: our Setup opens."); }
  if (a === "review") { return render(); }
  if (a === "go") { S.lnv = "progress"; playSteps(); return render(); }
  if (a === "close" && S.s === "running") { S.closing = true; return render(); }
  if (a === "cancel") { S.closing = false; return render(); }
  if (a === "closed") { S.closing = false; return flash("Foundry closes the world… then our Setup."); }
});
render();
</script>
