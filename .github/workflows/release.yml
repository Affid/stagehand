# A version tag (v0.1.0) publishes the companion module: the checks, then a
# GitHub release with stagehand.zip and module.json. Foundry's installer
# follows module.json's manifest URL (releases/latest/download/module.json)
# and downloads this version's zip; the package listing registers each
# release by its own module.json (releases/download/<tag>/module.json).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: The tag is the companion's version
        run: |
          version=$(node -p "require('./packages/module/static/module.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.json version $version" >&2
            exit 1
          fi
      - name: Zip the companion
        run: |
          cd packages/module/dist
          zip -r "$GITHUB_WORKSPACE/stagehand.zip" . -x "*.map"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            stagehand.zip packages/module/dist/module.json \
            --title "Stagehand $GITHUB_REF_NAME" \
            --notes "Changes: see CHANGELOG.md. Install the companion in Foundry with the manifest URL https://github.com/Affid/stagehand/releases/latest/download/module.json"
