# Every push and pull request: formatting, lint, types, unit tests with the
# coverage gate, and the build (pnpm verify). The live suites need a local
# Foundry and run on a developer's machine (README, Local Foundry).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
